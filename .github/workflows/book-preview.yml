name: Deploy book preview

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/book-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload book preview only
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
