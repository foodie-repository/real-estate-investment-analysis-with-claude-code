  <script id="book-content" type="application/json">[{"id": "title", "title": "책 펼치기", "blocks": ["<div class=\"book-cover\"><p class=\"cover-eyebrow\">책 미리보기<\/p>\n<h1>감을 확신으로<br>바꾸는<br>AI 부동산 투자<\/h1>\n<p class=\"cover-subtitle\">바이브 코딩으로 만드는<br>나만의 부동산 분석 도구<\/p>\n<p class=\"cover-author\">정상기 (푸디)<\/p>\n<button type=\"button\" class=\"cover-open\" data-start>책 펼쳐보기 <span aria-hidden=\"true\">→<\/span><\/button>\n<p class=\"cover-note\">전체 목차 · 저자 소개 · 저자의 말<br>이 책에 대하여 · 이 책을 읽는 방법<\/p><\/div>"]}, {"id": "contents", "title": "전체 목차", "blocks": ["<h1>목차<\/h1>", "<p class=\"toc-note\">1~9장과 부록의 전체 구성입니다. 본문 미리보기는 저자 소개부터 이 책을 읽는 방법까지 제공합니다.<\/p>", "<h3 id=\"저자-소개\">저자 소개<\/h3>\n", "<h3 id=\"저자의-말\">저자의 말<\/h3>\n", "<h3 id=\"이-책에-대하여\">이 책에 대하여<\/h3>\n", "<ul>\n<li>AI 대변혁의 시대<\/li>\n<li>부동산 투자 도구로 성장한 2026년의 AI<\/li>\n<li>단일 지표 투자 공식의 위험성<\/li>\n<li>프롬프트를 넘어 데이터 분석 자동화로<\/li>\n<\/ul>\n", "<h3 id=\"이-책을-읽는-방법\">이 책을 읽는 방법<\/h3>\n", "<ul>\n<li>이 책에서 완성할 여섯 가지 분석 도구<\/li>\n<li>시작하기 전에 준비할 것<\/li>\n<li>장별 구성과 읽는 순서<\/li>\n<li>프롬프트와 AI 답변을 읽는 법<\/li>\n<li>실습이 막혔을 때<\/li>\n<\/ul>\n", "<h3 id=\"부.-바이브-코딩으로-부동산-데이터-분석-시작하기\">1부. 바이브\n코딩으로 부동산 데이터 분석 시작하기<\/h3>\n", "<p><strong>1장. AI로 시작하는 데이터 기반 부동산 투자<\/strong><\/p>\n", "<ul>\n<li>1.1 근로소득만으로 부족한 자산 형성<\/li>\n<li>1.2 부동산의 투자 가치와 주의점<\/li>\n<li>1.3 정보의 홍수 속 함정<\/li>\n<li>1.4 감이 아닌 데이터로<\/li>\n<li>1.5 손품과 발품의 한계<\/li>\n<li>1.6 프롭테크의 등장, 그리고 한계<\/li>\n<li>1.7 AI가 바꿔놓은 게임의 규칙<\/li>\n<li>1.8 코딩 대신 AI와 대화하는 투자 분석<\/li>\n<li>1.9 바이브 코딩이란<\/li>\n<li>1.10 데이터로 판단하는 첫걸음<\/li>\n<\/ul>\n", "<p><strong>2장. 클로드 코드와 안티그래비티로 실습 환경\n만들기<\/strong><\/p>\n", "<ul>\n<li>2.1 터미널이란<\/li>\n<li>2.2 파이썬 설치<\/li>\n<li>2.3 안티그래비티 IDE 설치<\/li>\n<li>2.4 클로드 코드 설치<\/li>\n<li>2.5 바이브 코딩 첫 경험<\/li>\n<li>2.6 프로젝트 환경 구축<\/li>\n<li>2.7 분석 도구 설치<\/li>\n<li>2.8 설치 확인 및 첫 실행<\/li>\n<li>2.9 클로드 코드와 효과적으로 협업하는 법<\/li>\n<\/ul>\n", "<p><strong>3장. 실거래가·KB부동산 데이터 자동으로 모으고\n다듬기<\/strong><\/p>\n", "<ul>\n<li>3.1 아파트 실거래가 데이터 수집<\/li>\n<li>3.2 KB부동산 통계 데이터 수집<\/li>\n< 만든 대시보드에 적용한다<\/li>\n<li>AI에게 차트 검수를 맡길 때 쓰는 프롬프트<\/li>\n<li>한 페이지 체크리스트<\/li>\n<li>차트는 판단의 재료다<\/li>\n<\/ul>\n", "<h3 id=\"부록.-실습에-다시-쓰는-참고-자료\">부록. 실습에 다시 쓰는 참고\n자료<\/h3>\n", "<ul>\n<li>용어 찾아보기<\/li>\n<li>장별 프롬프트 찾아보기와 후속 요청<\/li>\n<\/ul>\n", "<h3 id=\"부록.-책의-프롬프트를-바꾸어-나만의-대시보드-만들기\">부록. 책의\n프롬프트를 바꾸어 나만의 대시보드 만들기<\/h3>\n", "<ul>\n<li>고칠 것인가, 새로 만들 것인가<\/li>\n<li>책의 문안에서 가져올 것, 바꿀 것, 뺄 것<\/li>\n<li>AI와 대화해 요구사항을 한 장으로 정리한다<\/li>\n<li>문안을 점검하고 첫 대시보드를 만든다<\/li>\n<li>숫자를 원자료와 대조한다<\/li>\n<li>최종 문안을 저장하고 다른 질문으로 넓힌다<\/li>\n<\/ul>\n", "<h3 id=\"에필로그\">에필로그<\/h3>\n"]}, {"id": "author", "title": "저자 소개", "blocks": ["<h1>저자 소개<\/h1>\n", "<div class=\"body-paragraph\">\n<p>지은이_ 정상기 (푸디)<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>데이터와 시각화를 통해 시장의 흐름을 읽어내는 데이터 분석가이자 실전 부동산 투자자다. 태블로<sup>Tableau<\/sup>를 비롯한 다양한 분석 도구를 활용해 복잡한 수치와 지표를 이해하기 쉬운 인사이트로 정리해 왔으며, 부동산과 거시경제 데이터 속에서 투자 판단에 필요한 핵심 신호를 포착하는 데 집중해 왔다. 숫자를 해석하는 분석가의 시선과 현장에서 검증해 온 투자자의 감각을 바탕으로 시장을 입체적으로 읽어내는 것이 특징이다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>최근에는 클로드 코드<sup>Claude Code<\/sup>, 코덱스, 제미나이<sup>Gemini<\/sup> 같은 AI 에이전트를 데이터 분석과 자동화 워크플로우에 적극적으로 접목하고 있다. 단순히 AI가 주는 답을 소비하는 데 그치지 않고, 문제를 구조화하고 AI가 제대로 이해하고 실행할 수 있도록 필요한 정보와 작업 흐름을 설계해 더 정확하고 실행 가능한 결과를 만들어 내는 과정에 몰두하고 있다. 전작 『<a href=\"https://www.yes24.com/product/goods/197068685\" target=\"_blank\" rel=\"noopener noreferrer\">난생처음 AI x 부동산 with 클로드, 제미나이, 챗GPT, 퍼플렉시티<\/a>』를 공동 집필하며 AI 기반 투자 분석의 가능성을 소개했고, 이번 책에서는 그 경험을 바탕으로 바이브 코딩<sup>Vibe Coding<\/sup>을 활용한 새로운 투자 리서치 방법론을 제안한다.<\/p>\n<\/div>\n"]}, {"id": "author-note", "title": "저자의 말", "blocks": ["<h1>저자의 말<\/h1>\n", "<div class=\"body-paragraph\">\n<p><strong>정답을 건네기보다, 스스로 판단할 수 있는 힘을<\/strong><\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>요즘 부동산에 관심을 갖고 공부하는 사람들이 많습니다. 주변에서도 비교할 지역이나 조건이 바뀔 때마다 여러 프롭테크 서비스를 오가며 필요한 데이터를 일일이 복사해 붙여 넣는 동료들을 자주 보았습니다. 그 모습을 보면서 바이브 코딩을 활용해 쌓은 경험과 시행착오를 나누어야겠다고 생각했습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>프롭테크는 흩어져 있던 실거래가와 시세, 매물, 학군과 교통 정보를 한곳에 모아 누구나 쉽게 볼 수 있게 했습니다. 다만 대부분의 서비스는 제공자가 미리 정한 지표와 화면을 중심으로 정보를 보여줍니다. 원하는 지역과 단지를 조회하기는 편리하지만, 각자의 질문에 맞춰 데이터를 조합하거나 분석 기준을 자유롭게 바꾸기는 어렵습니다. “가격은 오르는데 거래량은 왜 줄어들고 있을까?”, “비슷하게 움직이던 두 지역은 언제부터 무슨 이유로 흐름이 달라졌을까?”와 같은 질문에 답하려면 결국 데이터를 다시 모아 비교하고 스스로 해석해야 합니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>전작 《<a href=\"https://www.yes24.com/product/goods/197068685\" target=\"_blank\" rel=\"noopener noreferrer\">난생처음 AI x 부동산 with 클로드, 제미나이, 챗GPT, 퍼플렉시티<\/a>》를 함께 집필하면서 생성형 AI가 부동산 투자 분석의 진입 장벽을 크게 낮출 가능성을 확인했습니다. 자연어로 질문하며 시장 상황을 분석하고 정부 정책을 정리하며 지역과 단지를 비교할 수 있다는 점은 분명 큰 변화였습니다. 이번 책에서는 그 경험을 실제 데이터 수집과 분석, 시각화로 확장했습니다. AI에게 답을 얻는 데서 그치지 않고, 필요한 데이터를 직접 모아 원하는 기준으로 분석하고 대시보드를 통해 시장의 변화를 꾸준히 관찰하는 방법을 다룹니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>AI의 진짜 가치는 답변을 빨리 내놓는 데만 있지 않습니다. 생성형 AI의 답변은 새로운 관점을 얻는 좋은 출발점이지만, 중요한 투자 판단으로 이어가려면 어떤 데이터와 가정에 근거했는지 확인해야 합니다. 실제 데이터를 분석하고 차트와 지도에 나타내면 숫자만 볼 때 놓쳤던 관계가 드러납니다. 눈에 띄는 변화가 보이면 AI에게 원인을 묻고 관련 지표를 추가해 다시 분석할 수 있습니다. 다른 설명과 반대 근거도 함께 확인할 수 있습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>프롭테크가 데이터를 보여주는 창이라면, AI와 연결된 분석 환경은 그 데이터를 바탕으로 질문하고 실험하는 작업대에 가깝습니다. 대시보드에서 기간과 지역, 단지와 지표를 바꾸어 가며 시장의 변화를 비교하고, 새로 생긴 질문을 다시 분석에 반영할 수 있습니다. 이 과정을 통해 정해진 화면을 보는 데 머물지 않고, 각자의 질문에 맞는 분석을 직접 설계할 수 있습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>데이터 분석가이자 투자자로서 바이브 코딩으로 부동산 데이터를 수집하고 분석하며 반복 작업을 자동화해 왔습니다. 가격과 거래량의 변화는 차트와 지도에 나타내고, 대시보드로 시장의 흐름을 꾸준히 관찰했습니다. 이 방식의 효용성은 실제 작업을 통해 확인했습니다. 남은 고민은 그 경험과 시행착오를 어떻게 정리해야 전문 개발자가 아닌 독자도 자신만의 분석 체계를 만들 수 있을지였습니다. 그래서 실제 데이터를 수집하는 단계부터 분석과 시각화, 대시보드 구축, AI와의 상호작용까지 직접 따라갈 수 있는 순서로 이 책을 구성했습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>책 제목을 《감을 확신으로 바꾸는 AI 부동산 투자》라고 정한 까닭도 여기에 있습니다. 여기서 말하는 확신은 특정 지역의 가격이 반드시 오르리라는 믿음이 아닙니다. 막연한 직감을 하나의 가설로 세우고 데이터와 시각화로 검증한 뒤, 왜 이런 판단을 내렸는지 스스로 설명할 수 있는 상태를 뜻합니다. 어떤 조건이 달라지면 판단을 다시 검토해야 하는지도 알고 있어야 합니다. 근거가 부족하면 처음의 생각을 내려놓고, 새로운 데이터가 나오면 생각을 바꿀 수 있어야 합니다. 확신은 고집과 다릅니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책은 코딩 전문가를 위한 책이 아닙니다. 프롭테크의 정보를 조회하는 데서 한 걸음 더 나아가 자신만의 기준으로 시장을 비교하고 싶은 분, 반복되는 손품을 줄여 분석 체계를 만들고 싶은 분을 위해 썼습니다. 이 책에서 만드는 대시보드는 숫자를 보기 좋게 꾸민 결과물이 아니라 시장에 질문을 던지고 답을 여러 각도에서 확인하는 분석 도구입니다. 다른 사람의 해석에만 기대지 않고 필요한 자료를 직접 분석하고 검증한 뒤, 각자의 상황에 맞는 결정을 내리는 힘을 기르는 것이 이 책의 목표입니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>AI와 데이터도 최종 판단을 대신하지 않습니다. 데이터의 출처와 집계 기준을 확인하고, 차트에서 발견한 패턴을 다른 지표와 함께 검증해야 합니다. 전문가의 의견 역시 유용한 참고 자료이지만, 누군가의 확신이 스스로 내려야 할 판단과 그에 따른 책임까지 대신해 주지는 않습니다. 직접 데이터를 다루고 질문하고 확인하는 일을 꾸준히 반복할 때 주체적으로 판단하는 힘이 길러집니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>처음부터 거창한 시스템을 만들 필요는 없습니다. 관심 있는 지역의 실거래가를 불러오고 작은 차트 하나를 완성하는 것부터 시작하면 됩니다. 시장에 대한 감이 생기더라도 곧바로 확신하기보다 먼저 데이터로 확인해 보셨으면 합니다. 여러 신호를 비교하고 AI에게 다른 설명과 반대 근거를 물으며, 어떤 조건에서 판단을 바꿔야 하는지도 살펴보시기 바랍니다. 이런 습관이 쌓일 때 막연한 감은 비로소 데이터와 논리로 설명할 수 있는 확신이 됩니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책은 정답을 대신 말해주지 않습니다. AI의 답을 데이터로 검증하고, 숫자 속 관계를 시각화로 발견하고, 그 과정을 대시보드로 만들어 반복하는 방법을 알려드립니다. 프롭테크가 정보를 보는 방식을 바꾸었다면 AI와 바이브 코딩은 그 정보로 질문하고 분석하며 판단하는 방식을 바꾸고 있습니다. 독자 여러분도 이 변화를 직접 경험하기를 바랍니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>주말에도 책을 쓰느라 충분히 놀아주지 못한 아빠를 이해하고 기다려 준 아들 서준이에게 고맙고 사랑한다는 말을 전합니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책의 내용을 비롯해 데이터와 시각화를 활용한 투자 분석에 관한 이야기를 함께 나누고 싶은 분은 언제든지 이메일로 연락해 주시기 바랍니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>datafoodie@naver.com<\/p>\n<\/div>\n"]}, {"id": "about", "title": "이 책에 대하여", "blocks": ["<h1>이 책에 대하여<\/h1>\n", "<h2>AI 대변혁의 시대<\/h2>\n", "<div class=\"body-paragraph\">\n<p>2016년 3월, 알파고가 이세돌 9단을 4승 1패로 꺾었습니다. 많은 사람이 '인간이 기계에 졌다'고 받아들였습니다. 그 이후 약 10년 동안 바둑계는 큰 전환을 겪었습니다. 예전에는 기사들의 경험과 감각이 중심이었다면, 이제는 AI가 제시하는 수를 해석하고 검증하며 자기 것으로 만드는 과정이 실력의 핵심이 되었습니다. 중요한 점은, 바둑이 AI에 넘어간 것이 아니라 바둑이 AI와 공존하는 법을 익혔다는 사실입니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>지금 우리가 맞이한 부동산 투자 환경도 다르지 않습니다. 과거에는 발품과 손품을 많이 팔거나, 몇몇 전문가의 의견을 빨리 듣는 사람이 유리했습니다. 핵심은 데이터의 양이 아니라, 데이터를 해석하고 판단하는 능력이 사실상 소수 전문가에게 집중되어 있었다는 점입니다. 그래서 많은 개인 투자자는 정보가 있어도 스스로 검증하기보다, 주변의 말이나 전문가의 해석에 기대어 의사결정을 내리곤 했습니다. 이제는 상황이 달라졌습니다. 누구나 AI를 활용해 공개 지표와 거래 데이터를 스스로 정리하고, 가설을 검증하며, 판단 근거를 점검할 수 있습니다. 이 변화 앞에서 투자자가 던져야 할 질문은 명확합니다. \"누구 말을 믿을까?\"가 아니라 \"어떤 근거로 내가 판단할까?\"<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>AI는 그 질문에 답하도록 돕는 가장 현실적인 도구입니다. 지역 데이터 정리, 거래 흐름 비교, 가설 검증, 시나리오 점검까지, AI는 사람이 놓치기 쉬운 패턴을 빠르게 드러내고 생각의 빈틈을 보여줍니다. 물론 최종 결정은 언제나 사람의 몫입니다. 그래서 필요한 태도는 <strong>AI에 맡기는 투자<\/strong>가 아니라 <strong>AI와 함께 더 깊이 생각하는 투자<\/strong>입니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책은 바로 그 전환을 위한 실전 안내서입니다. 전문가의 한마디를 따라가는 수동적 투자에서 벗어나, AI를 활용해 스스로 분석하고 스스로 결정하는 투자자로 이동하는 방법을 다룹니다. 바둑계가 그랬듯, 이제 부동산 투자도 AI와 공존하는 사람에게 더 유리한 게임이 되고 있습니다.<\/p>\n<\/div>\n", "<h2>부동산 투자 도구로 성장한 2026년의 AI<\/h2>\n", "<div class=\"body-paragraph\">\n<p>\"AI가 대단하다는 건 알겠는데, 아직은 이르지 않나?\"<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>불과 2년 전만 해도 그 말이 맞았습니다. 2024년 초의 AI는 그럴듯한 말을 잘 만들어냈지만, 정작 신뢰하기는 어려웠습니다. 없는 사실을 지어내는 일이 잦았고, 복잡한 계산은 틀리기 일쑤였으며, 긴 문서를 주면 중간 내용을 빠뜨리곤 했습니다. 신기하긴 한데 실무에 쓰기엔 아직이라는 평가가 지배적이었습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>하지만 2026년 현재 AI는 2년 전과 비교해볼 때, 할 수 있는 일의 범위가 눈에 띄게 넓어졌습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>적절한 지시를 주면 AI는 공공데이터 API 기반 수집·분석 코드 초안을 작성하고, 정부정책 자료·연구보고서·뉴스의 핵심을 정리해 줍니다. 특정 조건에 맞는 예상 수익률 시뮬레이션도 몇 분이면 만들어냅니다. 임장을 다녀온 뒤 현장 메모를 전달하면, 시세와 개발 호재까지 반영한 임장 보고서 초안도 빠르게 정리해 줍니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>무엇보다 큰 변화는 소통의 방식입니다. 전문 개발자 수준의 문법 지식이 없어도, 일상 언어로 질문하고 요구사항을 구체화하면 실무에 쓸 분석 초안을 빠르게 만들 수 있습니다. \"현재 자금 상황이 이런데, A 지역과 B 지역 중 어디가 더 유리할까? 세금 문제까지 고려해서 비교해 줘\"라고 물으면, AI는 두 지역의 장단점과 세후 수익률 가정을 비교한 결과를 정리해 줍니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>더 이상 AI의 한계를 이유로 도입을 미룰 수 있는 시기가 아닙니다. 이제 AI는 특별한 무기가 아니라, 엑셀이나 인터넷 검색처럼 당연히 쓰는 기본 도구가 되어가고 있습니다. 엑셀을 안 쓰는 직장인이 업무에서 불리하듯, AI를 활용하지 않는 투자자는 같은 시간에 더 적은 정보로 판단할 수밖에 없습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>지금이 시작하기에 좋은 시점인 이유도 분명합니다. AI 도구는 상당히 발전되었고, 진입 장벽은 그 어느 때보다 낮아졌습니다. 이 기회를 먼저 활용하는 사람과 그렇지 않은 사람의 차이는 시간이 갈수록 커질 가능성이 높습니다.<\/p>\n<\/div>\n", "<h2>단일 지표 투자 공식의 위험성<\/h2>\n", "<div class=\"body-paragraph\">\n<p>부동산 시장의 역사를 데이터로 깊게 분석해보면 분명해지는 사실이 있습니다. <strong>한두 개 지표만으로 통하는 만능 공식<\/strong>은 없습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>거래량, 전세가율, 입주물량은 분명 중요한 신호입니다. 하지만 이 지표들만 보고 투자 결론을 내리면 시장을 지나치게 단편적으로 해석하게 됩니다. 같은 거래량 증가라도 금리 국면, 대출 규제, 지역별 수요 구조, 공급의 질과 양, 매수 심리에 따라 의미는 전혀 달라질 수 있습니다. 전세가율이 높다는 이유만으로 안전하다고 볼 수도 없고, 입주물량이 많다는 이유만으로 무조건 하락을 단정할 수도 없습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>결국 부동산 투자는 단순 산수가 아니라 <strong>고차방정식<\/strong>에 가깝습니다. 여러 변수가 서로 영향을 주고받고, 같은 변수라도 시점과 지역에 따라 다른 결과를 만듭니다. 그래서 단일 지표 공식에 기대는 투자는 판단을 쉽게 만들어 주는 대신, 실패 확률을 키울 위험이 있습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>필요한 것은 정답 공식이 아니라 판단 체계입니다. 여러 지표를 함께 읽고, 서로 충돌하는 신호를 검증하고, 시나리오별 리스크를 점검하는 과정이 결국 성패를 가릅니다. AI는 바로 이 복잡한 판단 과정을 더 빠르고 촘촘하게 수행하도록 돕는 도구입니다.<\/p>\n<\/div>\n", "<h2>프롬프트를 넘어 데이터 분석 자동화로<\/h2>\n", "<div class=\"body-paragraph\">\n<p>필자의 전작 『<a href=\"https://www.yes24.com/product/goods/197068685\" target=\"_blank\" rel=\"noopener noreferrer\">난생처음 AI x 부동산 with 클로드, 제미나이, 챗GPT, 퍼플렉시티<\/a>』는 AI를 처음 접하는 투자자를 위한 입문서였습니다. 챗GPT, 제미나이 같은 AI 채팅 앱에서 프롬프트만으로 거시경제와 정부정책을 분석하고, 자신의 예산에 맞는 지역과 단지를 선정하고, 임장 체크리스트를 작성하는 등의 방법을 다루었습니다. 코드는 한 줄도 쓰지 않았습니다. 프롬프트만으로도 놀라울 만큼 많은 것을 할 수 있다는 것을 보여주는 것이 그 책의 목표였습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>전작에서 소개한 프롬프트는 AI와 대화하며 투자 분석을 시작하는 강력한 출발점이었습니다. 바이브 코딩은 그 경험을 데이터와 실행의 영역으로 한 걸음 더 확장합니다. 필요한 데이터를 직접 수집하고, 수천만 건의 실거래가를 원하는 기준으로 분석하며, 여러 지역의 흐름을 차트와 지도에서 비교할 수 있습니다. 반복 작업을 자동화하고 대시보드로 꾸준히 관찰하는 체계를 갖추면, AI와의 대화는 일회성 답변을 넘어 자신만의 분석 환경으로 이어집니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이번 책은 그 확장 과정을 독자가 직접 따라갈 수 있도록 구성했습니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이를 위해 우리는 <strong>바이브 코딩<\/strong>이라는 새로운 방식을 사용합니다. 바이브 코딩이란 AI에 자연어로 원하는 것을 설명하면, AI가 코드를 작성해주는 개발 방식입니다. 프로그래밍 문법을 외울 필요가 없습니다. \"이 API에서 서울 아파트 실거래가를 수집해서 데이터베이스에 저장해줘\"라고 말하면 AI가 코드를 만들고 실행하며, 오류가 나면 수정안을 제시하거나 직접 수정을 시도합니다. 실행 결과는 독자가 반드시 확인해야 합니다. 독자는 AI와 대화하면서 자연스럽게 데이터 수집, 전처리, 분석, 시각화의 전 과정을 경험하게 됩니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책을 마치면 다음과 같은 것들을 직접 할 수 있게 됩니다.<\/p>\n<\/div>\n", "<div class=\"body-list\">\n<ul>\n<li>공공데이터 API에서 아파트 실거래가와 KB 데이터를 수집하여 나만의 데이터베이스를 구축합니다<\/li>\n<li>특정 지역의 가격 흐름과 거래량 추이를 차트로 시각화하고 해석합니다<\/li>\n<li>관심 단지의 가격 변동을 추적하는 대시보드를 만들어 반복 모니터링합니다<\/li>\n<li>여러 지역·단지의 가격과 매매·전세 갭을 비교하고, AI와 차이의 이유를 검토하여 매수 검토 후보를 정리합니다<\/li>\n<li>전세가율, 수익률 등을 계산하여 투자 판단의 근거를 만듭니다<\/li>\n<li>거래량 데이터를 지도 위에 표시하여 시계열 변화에 따른 지역별 거래 흐름과 선호도를 한눈에 파악합니다<\/li>\n<li>대시보드 시각화 차트를 AI에 전달하여, 정책·경제·수급·심리까지 반영한 종합 투자 분석 보고서를 작성합니다<\/li>\n<\/ul>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>핵심은 코딩 실력을 키우는 것이 아닙니다. <strong>데이터를 직접 다루는 경험을 통해, 남의 해석에 기대지 않고 스스로 판단할 수 있는 힘을 기르는 것<\/strong>입니다. 유튜버가 \"이 지역이 뜬다\"고 말할 때, 실거래가 데이터를 직접 꺼내서 확인할 수 있는 사람과 그렇지 못한 사람의 차이는 큽니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책의 실습 프로젝트를 따라하다 보면, 점진적으로 자신만의 부동산 투자 분석 시스템을 구축할 수 있을 것입니다. 지면의 한계로 모든 것을 다루지는 못하지만, 이 책에서 익힌 원리와 기술을 바탕으로 독자 스스로 더 고도화된 분석 시스템을 확장해 나갈 수 있을 것입니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>그리고 이 책에서 익히는 바이브 코딩은 부동산 분석에만 쓰이는 기술이 아닙니다. AI에 말로 설명해서 원하는 결과를 만들어내는 능력은 어디에든 적용됩니다. 회사에서 매달 반복하는 보고서를 자동화할 수도 있고, 매출 데이터를 직접 분석해서 의사결정에 활용할 수도 있습니다. 바이브 코딩은 부동산 투자를 위한 도구이자, 동시에 AI 시대를 살아가는 데 필요한 기본 역량입니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 책에서 다루는 바이브 코딩과 데이터 분석은 바로 그 토대가 되는 기술입니다. 이 기초를 탄탄히 다져두면, 어느새 AI라는 가장 든든한 도구를 손에 쥔, 더 이상 복잡한 시장 앞에서도 흔들리지 않는 단단한 투자자로 성장한 자신을 발견하게 될 것입니다.<\/p>\n<\/div>\n"]}, {"id": "reading-guide", "title": "이 책을 읽는 방법", "blocks": ["<h1>이 책을 읽는 방법<\/h1>\n", "<div class=\"body-paragraph\">\n<p>이 책은 코딩을 한 번도 해보지 않은 독자를 기준으로 썼습니다. 처음 보는 도구와 용어가 많지만, 필요한 설명은 해당하는 장에서 하나씩 합니다. 본격적으로 시작하기 전에 이 책에서 무엇을 만들게 되는지 완성 화면으로 먼저 보여드리고, 무엇을 준비하고 어떤 순서로 읽으면 좋은지, 실습이 막혔을 때 어디를 보면 되는지 안내합니다.<\/p>\n<\/div>\n", "<h2>이 책에서 완성할 여섯 가지 분석 도구<\/h2>\n", "<div class=\"body-paragraph\">\n<p>이 책은 이론서가 아닙니다. 처음부터 끝까지 직접 만들어보는 실습서입니다. 책을 다 읽고 나면, 여러분의 컴퓨터에는 데이터를 자동으로 모으는 수집 시스템과 그 데이터로 시장과 단지를 분석하는 여섯 가지 도구가 갖춰져 있을 것입니다.<\/p>\n<\/div>\n", "<h3>모든 도구의 바탕: 데이터 자동 수집 시스템<\/h3>\n", "<div class=\"body-paragraph\">\n<p>공공데이터포털, KB부동산, 국토교통부 API에서 아파트 실거래가, 전월세, 매매가격지수 등의 데이터를 자동으로 수집하여 데이터베이스에 저장하는 시스템입니다. 한 번 설정하면 매일 자동으로 최신 데이터가 쌓입니다. 3장에서 만드는 이 수집 시스템 위에서, 4장부터 9장까지 다음 여섯 가지 분석 도구를 하나씩 만듭니다.<\/p>\n<\/div>\n", "<h3>1. 관심단지 자동 트래킹 시스템(4장)<\/h3>\n", "<div class=\"body-paragraph\">\n<p>관심 있는 아파트 단지들의 실거래가, 전세가, 전세가율, 전고점 대비 등락률을 자동으로 조회하고 계산하여 구글 시트에 기록하는 시스템입니다. 클로드 코드에 \"트래킹 실행해줘\" 한마디면 수십 개 단지의 시세가 한 번에 업데이트됩니다.<\/p>\n<\/div>\n", "<div class=\"manual-figure img-image29\">\n<p><img src=\"assets/reading-guide-01.png\" alt=\"관심단지 자동 트래킹 시스템(4장), 구글 시트에 자동 기록된 트래킹 결과\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>관심단지 자동 트래킹 시스템(4장), 구글 시트에 자동 기록된 트래킹 결과<\/p>\n<\/div>\n<\/div>\n", "<h3>2. 수익률 계산기(5장)<\/h3>\n", "<div class=\"body-paragraph\">\n<p>관심단지를 과거의 특정 시점에 샀다면 수익률이 어땠을지 실거래가로 계산해 구글 시트에 정리하는 도구입니다. 매수 시점과 보유 기간, 단지와 면적을 바꿔 가며 갭과 전세 레버리지에 따라 결과가 어떻게 달라지는지 비교합니다. 이렇게 여러 단지 가운데 어느 단지가 더 많이 올랐고 수익률이 높았는지 살펴보면서, 수익률이 높았던 단지들에서 반복되는 패턴을 찾아봅니다.<\/p>\n<\/div>\n", "<div class=\"manual-figure img-image36\">\n<p><img src=\"assets/reading-guide-02.png\" alt=\"수익률 계산기(5장), 자동 생성된 수익률 비교 시트\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>수익률 계산기(5장), 자동 생성된 수익률 비교 시트<\/p>\n<\/div>\n<\/div>\n", "<h3>3. KB부동산 시각화 대시보드(6장)<\/h3>\n", "<div class=\"body-paragraph\">\n<p>KB부동산에서 제공하는 매매가격지수, 전세가격지수, 전세가율 데이터를 지도 위에 색상으로 표현하는 대시보드입니다. 전국 시군구별 가격 변동과 거래량을 한눈에 비교할 수 있어, 지금 어느 지역이 오르고 있는가라는 거시적 질문에 시각적으로 답해줍니다.<\/p>\n<\/div>\n", "<div class=\"manual-figure img-image61\">\n<p><img src=\"assets/reading-guide-03.png\" alt=\"KB부동산 시각화 대시보드(6장), 코로플레스 지도 2×2 배치\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>KB부동산 시각화 대시보드(6장), 코로플레스<sup>Choropleth<\/sup> 지도 2×2 배치<\/p>\n<\/div>\n<\/div>\n", "<div class=\"manual-figure img-image51\">\n<p><img src=\"assets/reading-guide-04.png\" alt=\"KB부동산 시각화 대시보드(6장), 시계열 분석(선 그래프 + 히트맵)\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>KB부동산 시각화 대시보드(6장), 시계열 분석(선 그래프 + 히트맵)<\/p>\n<\/div>\n<\/div>\n", "<h3>4. 실거래가 가격·갭 비교 대시보드(7장)<\/h3>\n", "<div class=\"body-paragraph\">\n<p>여러 지역의 단지를 한 표에 놓고 매매가격, 신규 전세가격, 갭과 고점 대비 수준을 비교하는 도구입니다. 정렬과 필터를 바꾸며 눈에 띄는 단지를 찾고, AI와 과거 이력과 외부 자료를 확인해 그 차이의 이유를 검토합니다. 7장에서는 비교 근거와 다음 확인 사항이 있는 후보 목록을 만듭니다.<\/p>\n<\/div>\n", "<div class=\"manual-figure img-ch07_price_gap_overview\">\n<p><img src=\"assets/reading-guide-05.png\" alt=\"실거래가 가격·갭 비교 대시보드(7장), 서울·경기·인천의 30평대 가격·갭 비교표와 비교 조건을 고르는 사이드바\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>실거래가 가격·갭 비교 대시보드(7장), 여러 지역의 아파트를 함께 보는 비교표<\/p>\n<\/div>\n<\/div>\n", "<h3>5. 거래량 지도 대시보드(8장)<\/h3>\n", "<div class=\"body-paragraph\">\n<p>거래량에는 사람들의 실제 선택이 남습니다. 오래 고민한 끝에 매수 버튼을 누른 결과가 숫자로 쌓이는 것입니다. 이 대시보드는 거래량을 지도 위에 올려, 사람들이 실제로 어디에 돈을 썼는지를 시각화합니다. 단지 규모를 보정하는 회전율까지 더해 선호도, 선호의 이동, 엑시트 가능성까지 한눈에 읽을 수 있습니다.<\/p>\n<\/div>\n", "<div class=\"manual-figure img-image26\">\n<p><img src=\"assets/reading-guide-06.png\" alt=\"거래량 지도 대시보드(8장), 포인트 마커 지도\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>거래량 지도 대시보드(8장), 포인트 마커<sup>Marker<\/sup> 지도<\/p>\n<\/div>\n<\/div>\n", "<h3>6. 가격 및 거래량 대시보드(9장)<\/h3>\n", "<div class=\"body-paragraph\">\n<p>특정 지역, 특정 단지의 매매가와 거래량 추이를 한눈에 보여주는 대시보드입니다. 가격과 거래량을 함께 보면 매수 타이밍을 판단하는 데 결정적인 힌트를 얻을 수 있습니다. 9장에서는 이 대시보드와 6·8장의 화면을 AI에 전달해 종합 투자 분석 보고서를 작성하는 방법도 다룹니다.<\/p>\n<\/div>\n", "<div class=\"manual-figure img-image58\">\n<p><img src=\"assets/reading-guide-07.png\" alt=\"가격 및 거래량 대시보드(9장), 시계열 차트\" decoding=\"async\"><\/p>\n<div class=\"manual-caption\">\n<p>가격 및 거래량 대시보드(9장), 시계열 차트<\/p>\n<\/div>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>이 여섯 가지 도구는 각각 독립적으로 활용할 수 있지만, 함께 사용하면 더욱 강력한 투자 판단 체계가 됩니다.<\/p>\n<\/div>\n", "<h2>시작하기 전에 준비할 것<\/h2>\n", "<div class=\"body-paragraph\">\n<p>실습을 시작하기 전에 다음 네 가지를 확인합시다. 설치와 발급 방법은 모두 본문에서 차례대로 안내하므로, 지금은 무엇이 필요한지만 알아두면 됩니다.<\/p>\n<\/div>\n", "<div class=\"body-list\">\n<ul>\n<li><strong>컴퓨터<\/strong>: 윈도우 10(64bit) 이상 또는 macOS 13 이상이 설치된 컴퓨터가 필요합니다. 메모리가 8GB여도 실습할 수 있지만 16GB라면 여유롭게 진행할 수 있습니다. 자세한 사양은 2.1절에서 확인합니다.<\/li>\n<li><strong>클로드 유료 구독<\/strong>: 클로드 코드는 무료 플랜에서 사용할 수 없으므로 최소 Pro 플랜에 가입해야 합니다. 실습하는 기간에만 구독하고 끝나면 해지해도 됩니다. 요금과 가입 방법은 2.4절에서 안내합니다.<\/li>\n<li><strong>구글 계정<\/strong>: 안티그래비티 IDE에 로그인할 때와 4·5장에서 결과를 구글 시트에 기록할 때 사용합니다.<\/li>\n<li><strong>무료 API 키<\/strong>: 3장에서 공공데이터포털, 카카오, V-World의 API 키를 발급받습니다. 모두 무료이며 각 절의 안내를 따라 하면 됩니다.<\/li>\n<\/ul>\n<\/div>\n", "<h2>장별 구성과 읽는 순서<\/h2>\n", "<div class=\"body-paragraph\">\n<p>처음 읽는다면 1장부터 순서대로 읽기를 권합니다. 1장에서는 데이터로 투자를 판단해야 하는 이유와 이 책에서 만들 도구를 소개합니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p><strong>2장<\/strong>에서는 실습에 필요한 도구를 설치합니다. 낯선 이름이 많지만, 2장에서 하나씩 차근차근 안내하니 지금은 이런 것들을 쓰는구나 정도만 알아둡시다.<\/p>\n<\/div>\n", "<div class=\"body-list\">\n<ul>\n<li><strong>파이썬<\/strong><sup>Python<\/sup>: AI가 작성하는 코드가 실행되는 프로그래밍 언어<\/li>\n<li><strong>안티그래비티 IDE<\/strong>: 코드를 편집하고 AI와 대화하는 에디터<\/li>\n<li><strong>클로드 코드<\/strong>: 말로 시키면 코드를 작성해주는 AI 코딩 도구<\/li>\n<li><strong>덕DB<\/strong>: 수십만 건의 거래 데이터를 저장하고 조회하는 초고속 데이터베이스<\/li>\n<li><strong>스트림릿<\/strong>: 파이썬으로 웹 대시보드를 만드는 시각화 도구<\/li>\n<\/ul>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p><strong>3장<\/strong>에서는 분석의 기반이 되는 데이터를 수집하고 정제합니다. 공공 API에서 실거래가 데이터를 가져오고, 분석에 적합한 형태로 가공하는 과정을 배웁니다. 여기서 구축한 데이터 파이프라인은 이후 모든 프로젝트의 기반이 됩니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p><strong>4~9장<\/strong>은 각각 하나의 도구를 완성하는 미니 프로젝트입니다. 매 프로젝트마다 왜 이 분석이 필요한가로 시작하여, AI에 전달할 프롬프트를 설계하고, 데이터를 탐색하고, 대시보드를 구축하고, 실제 투자에 활용하는 방법까지 하나의 흐름으로 진행됩니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>4~9장은 관심 있는 장부터 골라 읽을 수 있습니다. 다만 모든 장이 2장에서 만든 실습 환경과 3장에서 모은 데이터를 사용하므로, 2장과 3장은 건너뛰지 않습니다. 장마다 필요한 준비는 다음 표와 같습니다.<\/p>\n<\/div>\n", "<div class=\"table-window table-1\" role=\"region\" aria-label=\"표를 좌우로 이동하여 읽기\" tabindex=\"0\">\n<table>\n<colgroup>\n<col>\n<col>\n<col>\n<\/colgroup>\n<thead>\n<tr>\n<th>장<\/th>\n<th>만드는 결과물<\/th>\n<th>필요한 데이터와 준비<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4장<\/td>\n<td>관심단지 자동 트래킹 시스템<\/td>\n<td>실거래가(3.1절), 공동주택 기본정보(3.3절), 구글 시트 서비스 계정(4.3절)<\/td>\n<\/tr>\n<tr>\n<td>5장<\/td>\n<td>수익률 계산기<\/td>\n<td>실거래가, 공동주택 기본정보, 구글 시트 서비스 계정(4장에서 만든 설정을 재사용)<\/td>\n<\/tr>\n<tr>\n<td>6장<\/td>\n<td>KB부동산 시각화 대시보드<\/td>\n<td>KB부동산 통계(3.2절), 실거래가, 시군구 경계지도와 V-World API 키(3.5절)<\/td>\n<\/tr>\n<tr>\n<td>7장<\/td>\n<td>실거래가 가격·갭 비교 대시보드<\/td>\n<td>실거래가. 공동주택 기본정보가 있으면 세대수까지 표시<\/td>\n<\/tr>\n<tr>\n<td>8장<\/td>\n<td>거래량 지도 대시보드<\/td>\n<td>실거래가, 공동주택 기본정보, 주소별 좌표(3.4절)<\/td>\n<\/tr>\n<tr>\n<td>9장<\/td>\n<td>가격 및 거래량 대시보드<\/td>\n<td>실거래가. 7장 대시보드가 있으면 두 화면을 연결<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>독자의 상황에 따라 다음 경로로 시작해도 좋습니다.<\/p>\n<\/div>\n", "<div class=\"table-window table-2\" role=\"region\" aria-label=\"표를 좌우로 이동하여 읽기\" tabindex=\"0\">\n<table>\n<colgroup>\n<col>\n<col>\n<col>\n<\/colgroup>\n<thead>\n<tr>\n<th>독자<\/th>\n<th>지금의 고민<\/th>\n<th>추천 경로<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>코딩이 처음인 독자<\/td>\n<td>정말 따라 할 수 있을까<\/td>\n<td>1장부터 순서대로. 2.5절의 바이브 코딩 첫 경험을 꼭 직접 해봅니다<\/td>\n<\/tr>\n<tr>\n<td>완성된 결과부터 보고 싶은 독자<\/td>\n<td>무엇을 만들게 되는가<\/td>\n<td>앞의 완성 화면에서 관심 가는 결과물을 고른 뒤 2장부터<\/td>\n<\/tr>\n<tr>\n<td>특정 도구만 필요한 독자<\/td>\n<td>원하는 도구만 만들 수 있을까<\/td>\n<td>2장 → 3장 → 위 표에서 필요한 데이터를 확인한 뒤 해당 장<\/td>\n<\/tr>\n<tr>\n<td>개발 도구가 익숙한 독자<\/td>\n<td>어디를 건너뛰어도 될까<\/td>\n<td>2.8절의 체크리스트로 설치 상태만 확인 → 2.9절 → 3장<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n", "<h2>프롬프트와 AI 답변을 읽는 법<\/h2>\n", "<div class=\"body-paragraph\">\n<p>각 실습 절에는 독자가 그대로 입력할 수 있는 프롬프트가 들어 있습니다. 같은 프롬프트를 사용해도 AI가 만드는 파일명, 데이터 저장 방식, 변수명과 코드 구조는 달라질 수 있습니다. 그래서 본문은 특정 코드를 정답처럼 비교하지 않고, AI에게 요청할 내용과 독자가 확인할 결과를 중심으로 설명합니다. 처음에는 프롬프트를 그대로 따라 하고, 익숙해지면 자신의 분석 관점을 반영해 요구사항을 바꿔봅시다. 책의 프롬프트를 출발점으로 삼아 새 대시보드를 만드는 과정은 부록 「책의 프롬프트를 바꾸어 나만의 대시보드 만들기」에서 하나의 예로 처음부터 끝까지 보여줍니다.<\/p>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>본문에서는 역할에 따라 상자를 나누어 표시합니다.<\/p>\n<\/div>\n", "<div class=\"body-list\">\n<ul>\n<li><strong>프롬프트 전체 문안<\/strong>: 도구를 만들 때 클로드 코드에 입력하는 긴 프롬프트입니다. 일부만 골라 쓰지 말고 전체를 붙여 넣습니다.<\/li>\n<li><strong>사용자 요청<\/strong>과 <strong>AI 답변<\/strong>: 저자가 실제로 AI와 나눈 대화입니다. 독자가 같은 요청을 보내도 AI의 답변 문장과 수치는 데이터와 시점에 따라 달라집니다.<\/li>\n<li><strong>궁금해요!<\/strong>: 처음 나오는 용어나 개념을 짧게 설명합니다.<\/li>\n<li><strong>NOTE<\/strong>와 <strong>TIP<\/strong>: 주의할 점과 실습을 편하게 하는 요령입니다.<\/li>\n<\/ul>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>깃허브에는 이 도서에서 사용하는 프롬프트와 저자가 실습하며 만들어진 완성 사례를 공개합니다. 이 코드는 독자의 결과와 똑같아야 하는 정답이 아니라, 실습이 막혔을 때 참고하거나 완성된 기능을 직접 실행해보는 예시입니다.<\/p>\n<\/div>\n", "<div class=\"sample-box box-note\">\n<p><strong>NOTE 깃허브 저장소<\/strong><\/p>\n<p>이 책에서 입력하는 프롬프트와 참고용 완성 사례는 깃허브 저장소에 공개되어 있습니다. 완성 사례 결과물은 독자의 파일명과 코드 구조가 달라도 기능과 결과가 같으면 정상입니다. https://github.com/foodie-repository/real-estate-investment-analysis-with-claude-code<\/p>\n<\/div>\n", "<h2>실습이 막혔을 때<\/h2>\n", "<div class=\"body-paragraph\">\n<p>실습을 하다 보면 오류를 반드시 만납니다. 당황하지 말고 다음 순서로 확인합시다.<\/p>\n<\/div>\n", "<div class=\"body-list\">\n<ol>\n<li><strong>오류 메시지를 그대로 클로드 코드에 붙여 넣습니다.<\/strong> \"에러가 나요\"라고만 말하지 말고, 무엇을 했고 무엇이 나왔으며 무엇을 기대했는지 함께 적습니다. 화면이 이상하면 캡처한 이미지를 보여줍니다. 자세한 방법은 2.9절에서 다룹니다.<\/li>\n<li><strong>필요한 데이터가 준비되었는지 확인합니다.<\/strong> 데이터를 찾을 수 없다는 안내가 나오면 위의 장별 준비 표를 보고 3장의 해당 절로 돌아가 수집 결과를 확인합니다.<\/li>\n<li><strong>AI가 원하지 않는 방향으로 고쳤다면 되돌립니다.<\/strong> 잘못된 코드 위에 계속 덧붙이지 말고, 깃으로 작업 전 상태로 되돌린 뒤 요청을 다듬어 다시 시도합니다. 이 방법도 2.9절에서 다룹니다.<\/li>\n<li><strong>용어나 프롬프트의 위치가 기억나지 않으면 부록을 찾아봅니다.<\/strong> 부록 「실습에 다시 쓰는 참고 자료」에 용어 설명과 장별 프롬프트 위치, 후속 요청 예시를 모았습니다.<\/li>\n<li><strong>깃허브의 완성 사례와 비교합니다.<\/strong> 내 결과와 구현 방식은 달라도 같은 기능이 어떻게 동작하는지 확인할 수 있습니다.<\/li>\n<\/ol>\n<\/div>\n", "<div class=\"body-paragraph\">\n<p>준비가 되었다면 1장에서 왜 이제는 감이 아니라 데이터로 판단해야 하는지부터 살펴봅시다.<\/p>\n<\/div>\n"]}]</script>
